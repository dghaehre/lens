[package]
name = "lens"
version = "2.24.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
description = "lens is an interactive side-by-side diff viewer for git and Jujutsu repositories."
keywords = ["cli", "diff", "git", "jj", "review"]
categories = ["command-line-interface", "command-line-utilities"]
repository = "https://github.com/dghaehre/lens"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
thiserror = "2.0.21"
indoc = "2.0.8"
dirs = "7.0.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
similar = { version = "3.2.1", features = ["inline", "unicode"] }
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
tree-sitter = "0.27.1"
streaming-iterator = "0.1.9"
tree-sitter-highlight = "0.27.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-bash = "0.25.1"
tree-sitter-md = "0.5.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-elixir = "0.3.5"
tree-sitter-zig = "1.1.2"
tree-sitter-swift = "0.7.4"
once_cell = "1.21.4"
arboard = "3.7.0"
tui-textarea = { package = "ratatui-textarea", version = "0.9.3" }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }
jj-lib = { version = "=0.46.0", default-features = false, features = ["git"] }
pollster = "1.0.1"
futures = "0.3.34"
chrono = "0.4.45"
terminal-light = "1.9.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tree-sitter-sequel = "0.3.11"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
