[package]
name = "lens"
version = "2.24.0"
edition = "2021"
license = "MIT"
description = "lens is an interactive side-by-side diff viewer for git and Jujutsu repositories."
keywords = ["cli", "diff", "git", "jj", "review"]
categories = ["command-line-interface", "command-line-utilities"]
repository = "https://github.com/dghaehre/lens"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
indoc = "2.0.5"
dirs = "6.0.0"
ratatui = "0.29"
crossterm = "0.28"
similar = { version = "2.6", features = ["inline", "unicode"] }
notify = "7.0"
notify-debouncer-mini = "0.5"
tree-sitter = "0.25"
streaming-iterator = "0.1"
tree-sitter-highlight = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-json = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-md = "0.3"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1.2"
tree-sitter-swift = "0.7"
once_cell = "1.20"
arboard = "3.4"
tui-textarea = "0.7"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }
jj-lib = { version = "=0.42", default-features = false, features = ["git"] }
pollster = "0.4"
futures = "0.3"
chrono = "0.4"
terminal-light = "1.8.0"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
